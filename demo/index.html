<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#25226B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>NEON STACK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2325226B'/%3E%3Crect x='12' y='12' width='19' height='19' rx='5' fill='%233FD4FF'/%3E%3Crect x='33' y='12' width='19' height='19' rx='5' fill='%23FFC83D'/%3E%3Crect x='12' y='33' width='19' height='19' rx='5' fill='%23FF5E9C'/%3E%3Crect x='33' y='33' width='19' height='19' rx='5' fill='%2330E3A5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC83D"/><circle cx="12" cy="12" r="10" fill="none" stroke="#E58A00" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#FFE7A0" stroke-width="1.6"/><path d="M12 8.6v6.8" stroke="#C26F00" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-gem" viewBox="0 0 24 24"><path d="M6 4h12l4 5-10 12L2 9z" fill="#FF5E9C"/><path d="M2 9h20M8.5 4 12 21 15.5 4M6 4l2.5 5L12 4l3.5 5L18 4" fill="none" stroke="#FFD0E3" stroke-width="1.1" stroke-linejoin="round"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h6L9.8 22 19 9.8h-6.2z" fill="#30E3A5" stroke="#139B6C" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4.9a7.6 7.6 0 0 0-2.6-1.5L14 2.4h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.4l-2.4-.9-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4.9 2-3.4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.9l10.6-6.8a1 1 0 0 0 0-1.7L9.5 4.3A1 1 0 0 0 8 5.2z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.4" height="14" rx="1.4" fill="currentColor"/><rect x="13.6" y="5" width="4.4" height="14" rx="1.4" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7v8.5a1 1 0 0 1-1 1h-4.5v-6h-6v6H4.5a1 1 0 0 1-1-1z" fill="currentColor"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3" fill="currentColor"/><path d="m8 10 2 2 4-4M8 16h8" stroke="#2C2780" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="currentColor"/><path d="m10 9 5 3-5 3z" fill="#2C2780"/></symbol>
    <symbol id="i-shop" viewBox="0 0 24 24"><path d="M4 9h16l-1.2 10.2a1.6 1.6 0 0 1-1.6 1.4H6.8a1.6 1.6 0 0 1-1.6-1.4z" fill="currentColor"/><path d="M8.5 9V7.5a3.5 3.5 0 0 1 7 0V9" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4.5" fill="currentColor"/><path d="M3.5 21a8.5 8.5 0 0 1 17 0z" fill="currentColor"/></symbol>
    <symbol id="i-bomb" viewBox="0 0 24 24"><circle cx="11" cy="14" r="7.5" fill="#2C2780"/><circle cx="8.5" cy="11.5" r="2" fill="#6F67E0"/><path d="M15.5 8.5 18 6" stroke="#2C2780" stroke-width="2.6" stroke-linecap="round"/><circle cx="19.5" cy="4.5" r="2" fill="#FF9A3D"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8.5" fill="#3FD4FF" stroke="#1C8AB8" stroke-width="1.6"/><path d="M12 8.5V13l3 2" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/><rect x="10" y="2" width="4" height="2.6" rx="1" fill="#1C8AB8"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.8-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.1c0 5.6-8 10.4-8 10.4z" fill="currentColor"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15.5 15.5 4.5 4.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="2" fill="currentColor"/><rect x="3" y="13" width="8" height="8" rx="2" fill="currentColor"/><rect x="13" y="13" width="8" height="8" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2.4" fill="#FF5E9C"/><rect x="2" y="7" width="20" height="4.4" rx="1.6" fill="#FF8DBA"/><rect x="10.6" y="7" width="2.8" height="14" fill="#FFC83D"/><path d="M12 7c-1.5-3.5-5.5-3.8-5.5-1.5S10 7 12 7zm0 0c1.5-3.5 5.5-3.8 5.5-1.5S14 7 12 7z" fill="#FFC83D"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v6a5 5 0 0 1-10 0z" fill="#FFC83D"/><path d="M7 5H3.5a3.5 3.5 0 0 0 3.8 4.4M17 5h3.5a3.5 3.5 0 0 1-3.8 4.4" fill="none" stroke="#FFC83D" stroke-width="2"/><rect x="10.5" y="13" width="3" height="4" fill="#E58A00"/><rect x="7" y="17" width="10" height="3.6" rx="1.2" fill="#E58A00"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.4" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.4 4.4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.6-5.7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.7 3.6v5.2h-5.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="app" class="app" data-screen="splash">

  <!-- ============ 启动 ============ -->
  <section class="scr splash" id="scr-splash">
    <div class="logo" id="splash-logo" aria-label="NEON STACK"></div>
    <div class="splash__bar"><i id="splash-fill"></i></div>
    <p class="splash__tip" id="splash-tip"></p>
  </section>

  <!-- ============ 顶栏（全局资源） ============ -->
  <header class="topbar" id="topbar" hidden>
    <button class="avatar" id="tb-avatar" type="button" aria-label="Profile">
      <span class="avatar__face"></span><span class="avatar__lv" id="tb-lv">5</span>
    </button>
    <div class="res">
      <button class="res__pill" type="button" data-go="shop"><svg><use href="#i-bolt"/></svg><b id="tb-energy">5/5</b></button>
      <button class="res__pill" type="button" data-go="shop"><svg><use href="#i-coin"/></svg><b id="tb-coins">0</b><span class="res__plus">+</span></button>
      <button class="res__pill" type="button" data-go="shop"><svg><use href="#i-gem"/></svg><b id="tb-gems">0</b><span class="res__plus">+</span></button>
    </div>
    <button class="icon-btn" id="tb-settings" type="button" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
  </header>

  <!-- ============ 主页 ============ -->
  <section class="scr home" id="scr-home" hidden>
    <div class="logo logo--home" id="home-logo" aria-label="NEON STACK"></div>
    <div class="home__best"><svg><use href="#i-trophy"/></svg><span data-i18n="home.best"></span><b id="home-best">0</b></div>

    <div class="home__mid">
    <div class="home__side home__side--l">
      <button class="side-ico" type="button" data-go="tasks"><span class="side-ico__img"><svg><use href="#i-gift"/></svg></span><span data-i18n="home.daily"></span><i class="dot" id="dot-tasks" hidden></i></button>
      <button class="side-ico" type="button" id="checkin-open"><span class="side-ico__img"><svg><use href="#i-coin"/></svg></span><span data-i18n="home.checkin"></span><i class="dot" id="dot-checkin" hidden></i></button>
    </div>
      <div class="home__stage"><canvas id="home-stage"></canvas></div>
    <div class="home__side home__side--r">
      <button class="side-ico" type="button" id="rank-open"><span class="side-ico__img"><svg><use href="#i-trophy"/></svg></span><span data-i18n="home.rank"></span></button>
      <button class="side-ico side-ico--film" type="button" data-go="theater"><span class="side-ico__img"><svg><use href="#i-film"/></svg></span><span data-i18n="home.theater"></span><i class="dot dot--new" data-i18n="common.new"></i></button>
    </div>
    </div>

    <div class="modes" id="modes" role="tablist"></div>

    <button class="btn btn--gold btn--xl" id="play-btn" type="button">
      <span id="play-label" data-i18n="home.play"></span>
      <small class="btn__cost"><svg><use href="#i-bolt"/></svg>1</small>
    </button>

  </section>

  <!-- ============ 游戏 ============ -->
  <section class="scr game" id="scr-game" hidden>
    <header class="hud">
      <button class="icon-btn icon-btn--dark" id="pause-btn" type="button" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
      <div class="hud__score">
 <b id="hud-score">0</b>
 <span id="hud-sub"></span>
      </div>
      <div class="hud__next"><span data-i18n="game.next"></span><canvas id="next" width="96" height="60"></canvas></div>
    </header>
    <div class="hud__meter" id="hud-meter" hidden><i id="hud-meter-fill"></i><span id="hud-meter-label"></span></div>
    <main class="board-area" id="board-area">
      <div class="board-frame">
 <canvas id="board"></canvas>
        <div class="combo" id="combo" hidden></div>
        <div class="countdown" id="countdown" hidden></div>
      </div>
    </main>
    <footer class="powers">
      <button class="power" id="pw-bomb" type="button"><span class="power__ico"><svg><use href="#i-bomb"/></svg></span><b class="power__n" id="pw-bomb-n">0</b></button>
      <button class="power" id="pw-slow" type="button"><span class="power__ico"><svg><use href="#i-clock"/></svg></span><b class="power__n" id="pw-slow-n">0</b></button>
      <button class="power power--rot" id="pw-rot" type="button" aria-label="Rotate"><span class="power__ico"><svg><use href="#i-rotate"/></svg></span></button>
    </footer>
    <p class="gesture-tip" id="gesture-tip" data-i18n="game.gesture"></p>
  </section>

  <!-- ============ 剧场 ============ -->
  <section class="scr theater" id="scr-theater" hidden>
    <div class="th-head">
      <h1 class="scr-title" data-i18n="theater.title"></h1>
      <label class="search"><svg><use href="#i-search"/></svg><input id="th-search" type="search" enterkeyhint="search" autocomplete="off"></label>
    </div>
    <div class="th-body" id="th-body">
      <div class="th-hero" id="th-hero"><div class="th-hero__track" id="th-hero-track"></div><div class="th-hero__dots" id="th-hero-dots"></div></div>
      <div class="th-continue" id="th-continue" hidden></div>
      <div class="chips" id="th-cats"></div>
      <div id="th-rails"></div>
      <div class="th-all">
        <h2 class="sec-title sec-title--row" id="th-all-title"></h2>
 <div class="th-sort" id="th-sort">
   <button type="button" data-sort="default" class="is-on" data-i18n="theater.sortDefault"></button>
   <button type="button" data-sort="hot" data-i18n="theater.sortHot"></button>
   <button type="button" data-sort="new" data-i18n="theater.sortNew"></button>
        </div>
      </div>
      <p class="th-results" id="th-results" hidden></p>
      <div class="posters" id="th-grid"></div>
      <p class="th-more" id="th-more" hidden></p>
      <p class="empty" id="th-empty" hidden data-i18n="theater.empty"></p>
    </div>
  </section>

  <!-- ============ 任务 ============ -->
  <section class="scr tasks" id="scr-tasks" hidden>
    <h1 class="scr-title" data-i18n="tasks.title"></h1>
    <div class="streak" id="streak"></div>
    <div class="task-list" id="task-list"></div>
  </section>

  <!-- ============ 商店 ============ -->
  <section class="scr shop" id="scr-shop" hidden>
    <h1 class="scr-title" data-i18n="shop.title"></h1>
    <div class="shop-tabs" id="shop-tabs">
      <button type="button" data-tab="items" class="is-on" data-i18n="shop.items"></button>
      <button type="button" data-tab="skins" data-i18n="shop.skins"></button>
      <button type="button" data-tab="coins" data-i18n="shop.coins"></button>
    </div>
    <div class="shop-grid" id="shop-grid"></div>
  </section>

  <!-- ============ 我 ============ -->
  <section class="scr me" id="scr-me" hidden>
    <div class="profile">
      <span class="avatar avatar--lg"><span class="avatar__face"></span></span>
      <div><b id="me-name">Player 8848</b><span id="me-lv"></span><div class="xp"><i id="me-xp"></i></div></div>
    </div>
    <div class="stats" id="me-stats"></div>
    <h2 class="sec-title" data-i18n="me.watching"></h2>
    <div class="hrow" id="me-history"></div>
    <h2 class="sec-title" data-i18n="me.saved"></h2>
    <div class="hrow" id="me-favs"></div>
  </section>

  <!-- ============ 底栏 ============ -->
  <nav class="tabbar" id="tabbar" hidden>
    <button type="button" data-go="home" class="is-on"><svg><use href="#i-home"/></svg><span data-i18n="tab.home"></span></button>
    <button type="button" data-go="tasks"><svg><use href="#i-task"/></svg><span data-i18n="tab.tasks"></span><i class="dot" id="tab-dot-tasks" hidden></i></button>
    <button type="button" data-go="theater"><svg><use href="#i-film"/></svg><span data-i18n="tab.theater"></span></button>
    <button type="button" data-go="shop"><svg><use href="#i-shop"/></svg><span data-i18n="tab.shop"></span></button>
    <button type="button" data-go="me"><svg><use href="#i-user"/></svg><span data-i18n="tab.me"></span></button>
  </nav>

  <!-- ============ 剧集详情 ============ -->
  <section class="sheet detail" id="detail" hidden>
    <div class="detail__hero" id="dt-hero">
      <button class="icon-btn icon-btn--glass" id="dt-back" type="button" aria-label="Back"><svg><use href="#i-back"/></svg></button>
    </div>
    <div class="detail__body">
      <h2 id="dt-title"></h2>
      <p class="detail__meta" id="dt-meta"></p>
      <div class="tags" id="dt-tags"></div>
      <p class="detail__desc" id="dt-desc"></p>
      <div class="detail__cta">
        <button class="btn btn--gold" id="dt-play" type="button"></button>
 <button class="btn btn--ghost btn--square" id="dt-fav" type="button" aria-label="Save"><svg><use href="#i-star"/></svg></button>
      </div>
      <h3 class="sec-title" id="dt-eps-title"></h3>
      <div class="eps" id="dt-eps"></div>
    </div>
  </section>

  <!-- ============ 播放器 ============ -->
  <section class="player" id="player" hidden>
    <video id="video" playsinline muted preload="auto"></video>
    <div class="pl-shade pl-shade--t"></div><div class="pl-shade pl-shade--b"></div>
    <header class="pl-top">
      <button class="icon-btn icon-btn--glass" id="pl-close" type="button" aria-label="Close"><svg><use href="#i-back"/></svg></button>
      <div class="pl-title"><b id="pl-drama"></b><span id="pl-ep"></span></div>
      <span class="pl-reward" id="pl-reward" hidden></span>
    </header>
    <aside class="pl-side" id="pl-side">
      <button type="button" id="pl-like"><svg><use href="#i-heart"/></svg><span id="pl-like-n">0</span></button>
      <button type="button" id="pl-fav"><svg><use href="#i-star"/></svg><span id="pl-fav-l"></span></button>
      <button type="button" id="pl-list"><svg><use href="#i-list"/></svg><span data-i18n="player.episodes"></span></button>
    </aside>
    <div class="pl-bottom">
      <p class="pl-desc" id="pl-desc"></p>
      <div class="pl-track"><i id="pl-fill"></i></div>
      <div class="pl-meta"><span id="pl-time">00:00</span><span id="pl-hint"></span></div>
    </div>
    <div class="ep-sheet" id="ep-sheet" hidden>
      <div class="ep-sheet__card">
        <div class="ep-sheet__head"><b data-i18n="player.episodes"></b><button class="icon-btn icon-btn--dark" id="ep-sheet-x" type="button"><svg><use href="#i-close"/></svg></button></div>
        <div class="eps" id="ep-sheet-eps"></div>
      </div>
    </div>
  </section>

  <!-- ============ 弹窗容器 ============ -->
  <div class="modal" id="modal" hidden><div class="panel" id="panel"></div></div>
  <div class="toast" id="toast" hidden></div>
  <div class="fx" id="fx" aria-hidden="true"></div>
</div>

<noscript><div class="noscript">NEON STACK needs JavaScript.</div></noscript>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="sdk/mock/catalog.js"></script>
<script src="sdk/mock/gateway.js"></script>
<script src="sdk/laffic-content-sdk.js"></script>
<script src="js/tetris.js"></script>
<script src="js/sfx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
